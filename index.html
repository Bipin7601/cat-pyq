<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>CAT PYQ Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..112,400..700&family=Lexend:wght@300..600&display=swap">
<style>
/* Exam hall, not dashboard. Answer-sheet paper, graphite ink, one ballpoint-blue accent and the CAT
   question-palette colours. The one memorable element: every option is an OMR bubble row. */
:root{
  --paper:#F3F4F1; --sheet:#FFFFFF; --ink:#22262B; --pencil:#6A7079; --rule:#D8DBD3;
  --blue:#1D3FA6; --on-blue:#FFFFFF;
  --answered:#1F8A4C; --unanswered:#C2412D; --marked:#6B46C1; --unvisited:#C9CDD3; --on-state:#FFFFFF;
  --ok:var(--answered); --bad:var(--unanswered);
  --wash:color-mix(in srgb,var(--rule) 38%,var(--sheet));
  --blue-wash:color-mix(in srgb,var(--blue) 9%,var(--sheet));
  --ok-wash:color-mix(in srgb,var(--ok) 9%,var(--sheet));
  --bad-wash:color-mix(in srgb,var(--bad) 9%,var(--sheet));
  --imgbg:#FFFFFF;
  --f-ui:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-read:"Lexend",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Verdana,sans-serif;
  --r:8px; --rc:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15181C; --sheet:#1D2126; --ink:#E6E8EA; --pencil:#9AA1AB; --rule:#2E333A;
  --blue:#8FA6FF; --on-blue:#11151B;
  --answered:#4CC384; --unanswered:#F07A63; --marked:#A98BF0; --unvisited:#4A5059; --on-state:#11151B;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15181C; --sheet:#1D2126; --ink:#E6E8EA; --pencil:#9AA1AB; --rule:#2E333A;
  --blue:#8FA6FF; --on-blue:#11151B;
  --answered:#4CC384; --unanswered:#F07A63; --marked:#A98BF0; --unvisited:#4A5059; --on-state:#11151B;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--f-ui);font-weight:400}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
h1,h2,h3,h4{font-family:var(--f-ui);font-weight:600;font-stretch:112%;text-wrap:balance;margin:0;letter-spacing:-.005em;line-height:1.2}
h1{font-size:34px} h2{font-size:26px} h3{font-size:20px} h4{font-size:17px}
button,select,input,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-underline-offset:3px;text-decoration-thickness:1px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-ui);font-variant-numeric:tabular-nums}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--rule)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:8px 24px;min-height:56px;flex-wrap:wrap;padding-block:6px}
.brand{font:600 20px var(--f-ui);font-stretch:112%;text-decoration:none;color:var(--ink);letter-spacing:-.01em}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:var(--pencil);text-decoration:none;padding:6px 10px;border-radius:var(--rc);font-weight:500;font-size:15px}
nav a:hover{color:var(--ink)}
nav a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--blue);border-radius:0}

main{padding-block:36px 72px;display:grid;gap:44px}
.lede{color:var(--pencil);max-width:62ch;margin:10px 0 0;font-size:17px;line-height:1.5}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:6px 16px;flex-wrap:wrap;margin-bottom:14px}
.sec-head p{margin:0;color:var(--pencil);font-size:15px}
.empty-note{color:var(--pencil);font-size:14px;padding:8px 0;margin:0}

/* home: topic pickers */
.shelves{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r)}
.shelf{padding:16px 18px 18px;min-width:0}
.shelf+.shelf{border-left:1px solid var(--rule)}
@media (max-width:900px){.shelves{grid-template-columns:1fr}.shelf+.shelf{border-left:0;border-top:1px solid var(--rule)}}
.home-pick{display:flex;flex-direction:column;gap:8px}
.home-pick label{font:600 17px var(--f-ui);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.home-pick label small{font-size:14px;font-weight:400;color:var(--pencil);font-variant-numeric:tabular-nums}
.home-pick select{width:100%}

/* home + papers: year x slot table */
.ptable{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r)}
.prow{display:grid;grid-template-columns:112px repeat(3,minmax(0,1fr));border-top:1px solid var(--rule)}
.prow.phead{border-top:0}
.phead div{padding:12px 18px 10px;font:500 14px var(--f-ui);color:var(--pencil)}
.pyear{padding:16px 18px;font:600 34px/1 var(--f-ui);font-stretch:112%;font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin:0}
.pbox{padding:16px 18px 18px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-width:0;border-left:1px solid var(--rule)}
.pbox.off{color:var(--pencil)}
.pslot{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;font-size:15px;font-stretch:100%;font-weight:600}
.pbox .pmeta{font-size:14px;color:var(--pencil);font-variant-numeric:tabular-nums}
.pbox .tests{display:flex;flex-direction:column;align-items:flex-start;gap:8px;max-width:100%}
.pbox .last-results{display:flex;flex-direction:column;gap:2px}
.pbox .last-result{font-size:14px;font-variant-numeric:tabular-nums}
.pbox .untimed{font-size:14px}
@media (max-width:860px){
  .phead{display:none}
  .prow{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pyear{grid-column:1/-1;font-size:26px;padding:16px 18px 0}
  .pbox{border-left:0}
  .pbox+.pbox{border-left:1px solid var(--rule)}
  .pslot{position:static;width:auto;height:auto;overflow:visible;clip-path:none}
}
@media (max-width:640px){
  .prow{grid-template-columns:1fr}
  .pbox+.pbox{border-left:0;border-top:1px dashed var(--rule)}
}

/* controls */
.toolbar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px}
.field{display:grid;gap:5px;min-width:0}
.field label,.field .lbl{font-size:14px;font-weight:500;color:var(--pencil)}
select,input[type=text],textarea{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--rc);padding:8px 10px;max-width:100%;font-family:var(--f-ui)}
select{min-width:180px;min-height:40px}
select:hover,input[type=text]:hover:not(:disabled){border-color:var(--pencil)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--rc);overflow:hidden;background:var(--sheet);max-width:100%}
.seg button{border:0;background:none;min-height:38px;padding:6px 14px;cursor:pointer;font-weight:500;font-size:15px;color:var(--pencil);white-space:nowrap}
.seg button:hover{color:var(--ink);background:var(--wash)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--on-blue)}
.seg.quiet button{min-height:32px;padding:4px 11px;font-size:14px;color:var(--ink)}
.seg.quiet button:hover{color:var(--blue);background:var(--blue-wash)}
.ms{position:relative}
.ms-btn{min-width:180px;max-width:260px;min-height:40px;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--rc);padding:6px 10px;cursor:pointer;text-align:left}
.ms-btn:hover{border-color:var(--pencil)}
.ms-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-btn::after{content:"";width:7px;height:7px;border:solid var(--pencil);border-width:0 1.5px 1.5px 0;transform:translateY(-2px) rotate(45deg);flex:none;margin-right:3px}
.ms-panel{position:absolute;z-index:6;top:calc(100% + 4px);left:0;min-width:260px;max-width:min(380px,90vw);max-height:320px;overflow:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.ms-panel[hidden]{display:none}
.ms-tools{display:flex;gap:8px;padding:2px 2px 8px;border-bottom:1px solid var(--rule);margin-bottom:6px}
.ms-tools button{border:0;background:none;color:var(--blue);cursor:pointer;font-weight:500;font-size:14px;padding:2px 4px}
.ms-opt{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:var(--rc);cursor:pointer}
.ms-opt:hover{background:var(--wash)}
.ms-opt input{accent-color:var(--blue)}
.ms-opt em{margin-left:auto;font-size:14px;color:var(--pencil);font-style:normal;font-variant-numeric:tabular-nums}
.count{margin-left:auto;font-size:14px;color:var(--pencil);align-self:center;font-variant-numeric:tabular-nums}

/* session tally: one row of figures */
.tally{display:flex;flex-wrap:wrap;gap:10px 36px;padding:18px 2px 16px;border-bottom:1px solid var(--rule)}
.tally div{display:grid;gap:0}
.tally b{font:600 26px/1.15 var(--f-ui);font-variant-numeric:tabular-nums}
.tally span{font-size:14px;color:var(--pencil)}
.tally [data-k=correct] b{color:var(--ok)} .tally [data-k=wrong] b{color:var(--bad)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);padding:8px 14px;border-radius:var(--rc);cursor:pointer;font-weight:500;font-size:15px;text-decoration:none;line-height:1.3}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.primary:hover{color:var(--on-blue);background:color-mix(in srgb,var(--blue) 86%,var(--ink))}
.btn.danger{color:var(--bad)} .btn.danger:hover{border-color:var(--bad)}
.btn.small{padding:5px 11px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default;pointer-events:none}

/* question cards */
.list{display:grid;gap:20px}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:20px 24px 22px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-bottom:12px}
.src{font-size:14px;color:var(--pencil);font-variant-numeric:tabular-nums}
.card > .meta .src:first-child{color:var(--ink);font-weight:600;font-size:15px}
.chip{font-size:14px;color:var(--pencil)}
.chip.ok,.chip.bad{font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip.ok::before,.chip.bad::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.chip.ok{color:var(--ok)} .chip.bad{color:var(--bad)}
.qtext{margin:0 0 16px;overflow-wrap:anywhere;font:16px/1.65 var(--f-read);max-width:70ch}
.qtext p{margin:0 0 10px} .qtext p:last-child{margin:0}

/* OMR bubble options */
.opts{display:grid;gap:6px;list-style:none;margin:0;padding:0;max-width:70ch}
.opt{width:100%;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;background:var(--sheet);border:1px solid transparent;border-radius:var(--rc);padding:6px 10px 6px 6px;cursor:pointer;font:16px/1.5 var(--f-read);color:var(--ink)}
.opt .k{position:relative;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;border:1.5px solid var(--pencil);font:600 14px/1 var(--f-ui);color:var(--pencil);background:var(--sheet)}
.opt:hover:not(:disabled){background:var(--wash)}
.opt:hover:not(:disabled) .k{border-color:var(--blue);color:var(--blue)}
.opt:disabled{cursor:default}
.opt .mark{font:600 14px var(--f-ui);white-space:nowrap}
.opt.chosen .k{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.opt.chosen{background:var(--blue-wash)}
.opt.correct{border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.opt.correct .k{border:2px solid var(--ok);color:var(--ok)}
.opt.correct .mark{color:var(--ok)}
.opt.correct.picked{background:var(--ok-wash)}
.opt.correct.picked .k,.opt.wrong .k{color:transparent}
.opt.correct.picked .k{background:var(--ok);border-color:var(--ok)}
.opt.wrong{background:var(--bad-wash);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad)}
.opt.wrong .mark{color:var(--bad)}
.opt.correct.picked .k::after{content:"";position:absolute;left:50%;top:45%;width:7px;height:13px;border:solid var(--on-state);border-width:0 2.5px 2.5px 0;transform:translate(-50%,-50%) rotate(45deg)}
.opt.wrong .k::before,.opt.wrong .k::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:2.5px;border-radius:1px;background:var(--on-state);transform:translate(-50%,-50%) rotate(45deg)}
.opt.wrong .k::after{transform:translate(-50%,-50%) rotate(-45deg)}
.optrow{display:flex;flex-wrap:wrap;gap:10px;list-style:none;margin:0;padding:0}
.optrow .opt{width:auto;grid-template-columns:auto;padding:4px;border-radius:50%;gap:0}
.optrow .opt .k{width:38px;height:38px;font-size:15px}
.optrow .opt .mark{display:none}
.t-opts .opt{grid-template-columns:30px minmax(0,1fr)}
.optrow.t-opts .opt{grid-template-columns:auto}

.tita{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tita input,.t-tita input{width:180px;font-size:17px;font-variant-numeric:tabular-nums}
.tita input.correct{border-color:var(--ok);background:var(--ok-wash)} .tita input.wrong{border-color:var(--bad);background:var(--bad-wash)}
.verdict{font-weight:600;font-size:15px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.foot{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.foot:empty{display:none}
.solution{margin-top:18px;border-top:1px solid var(--rule);padding-top:14px;font:16px/1.65 var(--f-read);max-width:70ch}
.solution h4{margin:0 0 6px;font-size:15px;font-stretch:100%}
.solution .ans{font-weight:700;margin-bottom:8px}
.solution p{margin:0 0 10px}

/* DILR / RC set */
.set{padding:0;overflow:hidden}
.set-head{padding:16px 24px;border-bottom:1px solid var(--rule)}
.set-head .meta{margin:0 0 4px}
.set-head h3{font-size:20px}
.set-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.directions{padding:20px 24px;border-right:1px solid var(--rule);min-width:0;background:color-mix(in srgb,var(--paper) 45%,var(--sheet))}
.directions-inner{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 100px);overflow:auto}
.directions h4,.t-dir h4{font-size:15px;font-stretch:100%;margin-bottom:8px}
.set-qs{padding:20px 24px;display:grid;gap:24px;min-width:0}
.set-q + .set-q{border-top:1px solid var(--rule);padding-top:22px}
.qno{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-bottom:8px}
.qno b{font-weight:600;font-size:15px}
@media (max-width:860px){.set-body{grid-template-columns:1fr}.directions{border-right:0;border-bottom:1px solid var(--rule)}.directions-inner{position:static;max-height:none}}
.tbl{overflow-x:auto;margin:10px 0}
.tbl table{border-collapse:collapse;font:15px var(--f-ui);font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border:1px solid var(--rule);padding:5px 10px;text-align:left;white-space:nowrap}
.tbl th{background:var(--wash);font-weight:600}

.paper-head{display:flex;justify-content:space-between;gap:16px;align-items:end;flex-wrap:wrap}
.empty{background:var(--sheet);border:1px dashed var(--rule);border-radius:var(--r);padding:32px;color:var(--pencil)}
.empty h3{color:var(--ink);margin-bottom:8px}
.empty p{margin:8px 0 0}
.empty .btn+.btn{margin-left:8px}
.msg{font-size:14px;margin-top:8px} .msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
.confirm{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
sup{font-size:.72em}
.imgpaper{background:var(--imgbg);border:1px solid var(--rule);border-radius:var(--rc);padding:10px;overflow-x:auto;margin:0 0 16px}
.imgpaper img{display:block;max-width:100%;height:auto;margin:0 auto;zoom:1.15}
.imgpaper img:not([src]){min-height:90px;width:100%;background:linear-gradient(90deg,#eceee9,#f7f8f5,#eceee9);background-size:200% 100%;animation:shimmer 1.2s linear infinite;border-radius:var(--rc)}
@keyframes shimmer{to{background-position:-200% 0}}
.textfallback summary{cursor:pointer;color:var(--pencil);font-size:14px;margin-top:6px}
.setsol{margin-top:16px}
.mathy p{margin:0 0 10px} .mathy p:last-child{margin:0}
.opt .mathy p{margin:0}
.ans .mathy, .ans .mathy p{display:inline;margin:0}
.mathy mjx-container{display:inline-block;max-width:100%;overflow-x:auto;overflow-y:hidden;vertical-align:middle}
.mathy mjx-container[display="true"]{display:block;margin:6px 0}
details.orig{margin:0 0 16px}
details summary{cursor:pointer;color:var(--pencil);font-size:14px}
details summary:hover{color:var(--ink)}
details.orig summary{margin-bottom:8px}
details.orig[open] summary{margin-bottom:10px}
.imgpaper img[src]{cursor:zoom-in}
.optimg{display:inline-block;background:var(--imgbg);border-radius:var(--rc);padding:4px 8px;line-height:0}
.optimg img{display:block;max-width:100%;height:auto;zoom:1.35}
.optimg img:not([src]){width:90px;height:22px;background:#eceee9}
.opt .optimg{justify-self:start}
.zoom{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,#000 70%,transparent);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px))}
.zoom-bar{display:flex;justify-content:flex-end;margin-bottom:8px}
.zoom-body{flex:1;overflow:auto;background:var(--imgbg);border-radius:var(--r);padding:12px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.zoom-body img{display:block;max-width:none;width:max(100%,900px);margin:0 auto}

/* timed test screen */
main.wide,body:has(main.wide) .bar .wrap{max-width:1440px}
main.wide{padding-top:20px}
.tscreen{display:grid;gap:14px;min-width:0}
.t-head{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px 24px;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:10px 18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:4}
.t-title{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;min-width:0}
.t-title b{font:600 17px var(--f-ui);font-stretch:112%}
.t-title span{font-size:14px;color:var(--pencil)}
.t-strip{display:flex;align-items:center;list-style:none;margin:0;padding:0;font-size:15px;font-weight:500}
.t-strip li{display:flex;align-items:center;color:var(--pencil)}
.t-strip li+li::before{content:"";width:28px;height:1px;background:var(--rule);margin:0 10px}
.t-strip span{display:inline-flex;align-items:center;gap:8px}
.t-strip span::before{content:"";box-sizing:border-box;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--unvisited);flex:none}
.t-strip .active{color:var(--ink);font-weight:600}
.t-strip .active span::before{border:5px solid var(--blue)}
.t-strip .done span::before{background:var(--answered);border-color:var(--answered)}
.t-strip .done span{position:relative}
.t-strip .done span::after{content:"";position:absolute;left:5.5px;top:50%;width:4px;height:8px;border:solid var(--on-state);border-width:0 2px 2px 0;transform:translateY(-62%) rotate(45deg)}
.t-timer{justify-self:end;font:600 26px/1.1 var(--f-ui);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.t-timer.warn{color:var(--unanswered)}
.t-body{display:grid;grid-template-columns:minmax(0,1fr) 272px;gap:14px;align-items:start}
.t-main{display:grid;grid-template-columns:minmax(0,1fr);background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);min-width:0}
.t-main.has-dir{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.t-dir{padding:20px 24px;border-right:1px solid var(--rule);min-width:0;max-height:calc(100vh - 170px);overflow:auto;position:sticky;top:132px;background:color-mix(in srgb,var(--paper) 45%,var(--sheet))}
.t-dir .src{display:block;margin:-4px 0 12px}
.t-q{padding:20px 24px;min-width:0}
.t-qhead{display:flex;gap:4px 14px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
.t-qhead b{font:600 17px var(--f-ui);font-variant-numeric:tabular-nums}
.t-tita{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.t-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:22px;padding-top:16px;border-top:1px solid var(--rule)}
.t-actions [data-act=t-mark][aria-pressed=true]{border-color:var(--marked);color:var(--marked)}
.t-nav{display:flex;gap:8px;margin-left:auto}
.t-side{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px;display:grid;gap:14px;position:sticky;top:132px}
.t-side-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.t-side-h h3{font-size:17px}
.t-side-h span{font-size:14px;color:var(--pencil)}
.t-pal{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.pal{height:36px;border-radius:4px;border:1px solid transparent;background:var(--unvisited);color:var(--ink);font:600 14px var(--f-ui);font-variant-numeric:tabular-nums;cursor:pointer;position:relative;padding:0}
.pal:hover{filter:brightness(.95)}
.pal.not-answered{background:var(--unanswered);color:var(--on-state)}
.pal.answered{background:var(--answered);color:var(--on-state)}
.pal.marked{background:var(--marked);color:var(--on-state);border-radius:50%;width:36px;justify-self:center}
.pal.answered-marked{background:var(--marked);color:var(--on-state);border-radius:50%;width:36px;justify-self:center}
.pal.answered-marked::after{content:"";position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:var(--answered);border:2px solid var(--sheet)}
.pal.cur{outline:2px solid var(--ink);outline-offset:2px}
.t-legend{list-style:none;margin:0;padding:12px 0 0;border-top:1px solid var(--rule);display:grid;gap:6px;font-size:14px;color:var(--pencil)}
.t-legend li{display:flex;align-items:center;gap:10px}
.t-legend .pal{width:18px;height:18px;cursor:default;flex:none;justify-self:auto}
.t-legend .pal.answered-marked::after{width:8px;height:8px;border-width:1.5px;right:-2px;bottom:-2px}
.t-legend b{margin-left:auto;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.t-submit{width:100%}
.t-confirm{border:1px solid var(--rule);background:var(--wash);border-radius:var(--rc);padding:12px;display:grid;gap:10px;font-size:15px}
.t-confirm p{margin:0}
.t-confirm div{display:flex;gap:8px;flex-wrap:wrap}
.t-modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px}
.t-modal-box{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:22px;max-width:480px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.t-modal-box p{color:var(--pencil);font-size:15px}
.t-modal-actions{display:flex;gap:8px;flex-wrap:wrap}
.t-nosave{margin:0;padding:8px 14px;font-size:14px;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--rc);color:var(--pencil)}

/* review */
.t-review{display:grid;gap:0;min-width:0}
.t-review h1{font-size:26px;margin:0 0 18px}
.r-summary{display:flex;flex-wrap:wrap;gap:20px 48px;align-items:flex-start;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:20px 24px;margin:0 0 24px}
.t-score{margin:0;display:grid;gap:2px}
.t-score span{font-size:14px;color:var(--pencil)}
.t-score b{font:600 34px/1.1 var(--f-ui);font-stretch:112%;font-variant-numeric:tabular-nums;white-space:nowrap}
.r-table-wrap{flex:1;min-width:0;overflow-x:auto}
.r-table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
.r-table th,.r-table td{border-bottom:1px solid var(--rule);padding:7px 10px;text-align:right;white-space:nowrap}
.r-table th:first-child,.r-table td:first-child{text-align:left;padding-left:0}
.r-table thead th{font-size:14px;font-weight:500;color:var(--pencil)}
.r-table tfoot th,.r-table tfoot td{font-weight:600;border-bottom:0}
.r-table tbody tr:last-child td{border-bottom-color:var(--pencil)}
.r-table tfoot th{text-align:left;padding-left:0}
.r-filters{margin:0 0 18px;align-self:start;justify-self:start}
.r-q{border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet);padding:20px 24px 22px;margin-bottom:16px}
.r-q[hidden]{display:none}
.r-q .r-head{display:flex;gap:4px 14px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
.r-q .r-head b{font-size:17px;font-weight:600}
.r-q .r-dir{margin-bottom:12px}.r-q .r-setsol .setsol{margin-top:8px}
.r-q .r-dir[open]{background:color-mix(in srgb,var(--paper) 45%,var(--sheet));border:1px solid var(--rule);border-radius:var(--rc);padding:10px 14px}
.r-q .opt{cursor:default}
.r-ans{margin:14px 0 0;font-size:15px;display:flex;gap:6px 20px;flex-wrap:wrap}
.r-ans .ok{color:var(--ok);font-weight:600} .r-ans .bad{color:var(--bad);font-weight:600}
.t-review > p:last-child{margin:8px 0 0}

@media (max-width:980px){.t-body{grid-template-columns:1fr}.t-side,.t-dir{position:static}.t-main.has-dir{grid-template-columns:1fr}.t-dir{border-right:0;border-bottom:1px solid var(--rule);max-height:none}
  .t-head{grid-template-columns:1fr auto}.t-strip{grid-column:1/-1;grid-row:2}}
@media (max-width:560px){h1{font-size:26px}.card,.r-q{padding:16px}.set-head,.directions,.set-qs,.t-q,.t-dir{padding:16px}.opt{gap:10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

window.MathJax = {
  tex: { inlineMath: [["$$","$$"], ["\\(","\\)"]], displayMath: [["\\[","\\]"]] },
  svg: { fontCache: "global" },
  startup: { typeset: false, ready(){ MathJax.startup.defaultReady(); MathJax.startup.promise.then(() => window.__typesetAll && window.__typesetAll()); } }
};

<header class="bar">
  <div class="wrap">
    <a class="brand" href="#home">CAT PYQ Desk</a>
    <nav id="nav" aria-label="Main">
      <a href="#practice">Practice</a>
      <a href="#papers">Full papers</a>
    </nav>
  </div>
</header>
<main class="wrap" id="app"><div class="empty"><h3>Loading questions</h3></div></main>

<script src="js/core.js"></script>
<script src="js/exam-view.js"></script>
<script>
(() => {
"use strict";
const ALL_SECTIONS = ["QA","DILR","VARC"];
let SECTIONS = ALL_SECTIONS.slice();
let features = {dilr:true, originals:true};
const SECTION_NAME = {QA:"Quantitative Ability", DILR:"Data Interpretation & Logical Reasoning", VARC:"Verbal Ability & Reading Comprehension"};
const SECTION_SHORT = {QA:"Quantitative Ability", DILR:"Data Interp. & LR", VARC:"Verbal & RC"};
const TOPICS = {
  QA:["Percentages & Profit-Loss","Ratio, Proportion & Mixtures","Interest (SI/CI)","Time, Speed & Distance","Time & Work","Averages","Equations & Inequalities","Functions & Graphs","Logs, Surds & Indices","Progressions & Series","Number Systems","Geometry & Mensuration","Coordinate Geometry","P&C, Probability & Sets"],
  DILR:["Tables & Charts","Quant-based DI","Arrangements","Games & Tournaments","Selection & Conditions","Scheduling","Venn & Sets","Routes & Networks","Puzzles"],
  VARC:["Reading Comprehension","Para Summary","Para Jumbles","Odd Sentence Out","Sentence Placement"]
};
const YEARS = [2025,2024,2023,2022,2021,2020];
const SLOTS = [1,2,3];

/* ---------- storage (per-browser convenience) ---------- */
// When localStorage throws (blocked site data, some private windows, previews) values are kept in
// memory for this page's life: everything works, only surviving a refresh is lost.
// mem holds a key only while its last localStorage write failed (null = deleted).
const mem = new Map();
const store = {
  persistent: true,
  get(k, d){
    try{
      if(mem.has(k)){ const m = mem.get(k); return m === null ? d : JSON.parse(m); }
      const v = localStorage.getItem(k); return v ? JSON.parse(v) : d;
    }catch(e){ return d; }
  },
  set(k, v){
    const s = JSON.stringify(v);
    try{ localStorage.setItem(k, s); mem.delete(k); }catch(e){ mem.set(k, s); store.persistent = false; }
  },
  del(k){ try{ localStorage.removeItem(k); mem.delete(k); }catch(e){ mem.set(k, null); store.persistent = false; } }
};
const K_PROG = "catpyq.progress.v1", K_FILT = "catpyq.filters.v2", K_FILT_V1 = "catpyq.filters.v1";
let progress = store.get(K_PROG, {});          // qid -> {v: chosen value, ok: bool}
let filters = Core.normalizeFilters(store.get(K_FILT, null) || store.get(K_FILT_V1, null));
let revealed = new Set();                       // qids whose solution is shown without attempting
let revealedSets = new Set();                   // set ids whose overall explanation is shown

/* ---------- data ---------- */
let base = {items:[]};
let items = [];        // normalised: units (single question or set)
let qIndex = new Map();// qid -> {q, unit}

function paperLabel(p){
  if(!p) return "";
  if(p === "sample") return "Sample (not from CAT)";
  const [y,s] = p.split("-"); return `CAT ${y} Slot ${s}`;
}
function normalise(list, origin){
  const out = [];
  (list||[]).forEach((u, i) => {
    if(!u || !u.section) return;
    const unit = Object.assign({}, u, {origin});
    unit.id = u.id || `${origin}-${u.paper||"x"}-${u.section}-${i}`;
    if(u.kind === "set"){
      unit.questions = (u.questions||[]).map((q, j) => Object.assign({}, q, {id: q.id || `${unit.id}-q${j+1}`}));
    }else{
      unit.kind = "q";
    }
    out.push(unit);
  });
  return out;
}
function rebuild(){
  features = Object.assign({dilr:true, originals:true}, base.features || {});
  SECTIONS = features.dilr ? ALL_SECTIONS.slice() : ALL_SECTIONS.filter(s => s !== "DILR");
  if(!SECTIONS.includes(filters.section)){ filters.section = SECTIONS[0]; filters.topics = []; filters.papers = []; }
  items = normalise(base.items, "base").filter(u => SECTIONS.includes(u.section));
  qIndex = new Map();
  items.forEach(u => {
    if(u.kind === "set") u.questions.forEach(q => qIndex.set(q.id, {q, unit:u}));
    else qIndex.set(u.id, {q:u, unit:u});
  });
}
const questionsOf = Core.questionsOf;
function papersAvailable(){
  const m = new Map();
  items.forEach(u => { if(!u.paper) return; const e = m.get(u.paper) || {QA:0,DILR:0,VARC:0}; e[u.section] += questionsOf(u).length; m.set(u.paper, e); });
  return m;
}
function topicList(section){
  const known = TOPICS[section] || [];
  const extra = [...new Set(items.filter(u => u.section === section).map(u => u.topic).filter(t => t && !known.includes(t)))];
  return known.concat(extra);
}

/* ---------- text formatting ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function inline(s){
  let t = esc(s);
  t = t.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  t = t.replace(/sqrt\(([^()]*)\)/g, "√($1)");
  t = t.replace(/\^\(([^()]+)\)/g, "<sup>$1</sup>").replace(/\^(-?[\w.]+)/g, "<sup>$1</sup>");
  t = t.replace(/_\{([^}]+)\}/g, "<sub>$1</sub>").replace(/log_(\w+)/g, "log<sub>$1</sub>");
  t = t.replace(/&lt;=/g, "≤").replace(/&gt;=/g, "≥").replace(/!=/g, "≠");
  return t;
}
function rich(s){
  const lines = String(s ?? "").split(/\r?\n/);
  let html = "", para = [], i = 0;
  const flush = () => { if(para.length){ html += `<p>${para.map(inline).join("<br>")}</p>`; para = []; } };
  while(i < lines.length){
    const ln = lines[i];
    if(/^\s*\|.*\|\s*$/.test(ln)){
      flush();
      const rows = [];
      while(i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){ rows.push(lines[i]); i++; }
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const body = rows.filter(r => !/^[\s|:-]+$/.test(r));
      const head = cells(body[0]);
      html += `<div class="tbl"><table><thead><tr>${head.map(c=>`<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${
        body.slice(1).map(r => `<tr>${cells(r).map(c=>`<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      continue;
    }
    if(!ln.trim()){ flush(); } else para.push(ln);
    i++;
  }
  flush();
  return html;
}

/* ---------- images (lazy bundles) ---------- */
// A failed or non-ok fetch rejects and is evicted, so the next render fetches again.
const bundles = new Map();
function bundle(kind, paper, sec){
  const k = `${kind}/${paper}-${sec}`;
  if(!bundles.has(k)){
    const p = fetch(`data/${k}.json`).then(r => { if(!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); });
    p.catch(() => { if(bundles.get(k) === p) bundles.delete(k); });
    bundles.set(k, p);
  }
  return bundles.get(k);
}
function imgTag(kind, u, id, alt){
  return `<div class="imgpaper"><img alt="${esc(alt)}" data-b="${kind}" data-p="${esc(u.paper)}" data-s="${esc(u.section)}" data-id="${esc(id)}"></div>`;
}
function hydrate(img){
  bundle(img.dataset.b, img.dataset.p, img.dataset.s).catch(() => ({})).then(b => {
    const src = b[img.dataset.id];
    if(src) img.src = src;
    else if(img.parentElement.classList.contains("imgpaper")) img.parentElement.innerHTML = `<p class="empty-note">Image not available.</p>`;
    else img.replaceWith(document.createTextNode("—"));
  });
}
const io = ("IntersectionObserver" in window) ? new IntersectionObserver(es => es.forEach(e => {
  if(e.isIntersecting){ io.unobserve(e.target); hydrate(e.target); }
}), {rootMargin: "900px 0px"}) : null;
function hydrateExpl(el){
  el.dataset.done = "1";
  bundle("x", el.dataset.xp, el.dataset.xs).then(b => {
    const h = b[el.dataset.xid];
    if(h){ el.innerHTML = h; typeset(el); } else el.innerHTML = `<p class="empty-note">Explanation coming soon.</p>`;
  }, () => { el.innerHTML = `<p class="empty-note">Couldn\u2019t load the explanation. Check your connection and reopen it.</p>`; });
}
function observeImgs(root){
  root.querySelectorAll("img[data-b]:not([src])").forEach(i => io ? io.observe(i) : hydrate(i));
  root.querySelectorAll(".expl[data-xp]:not([data-done])").forEach(hydrateExpl);
}
const explTag = (u, id, has) => has ? `<div class="expl mathy" data-xp="${esc(u.paper)}" data-xs="${esc(u.section)}" data-xid="${esc(id)}"></div>` : `<p class="empty-note">Explanation coming soon.</p>`;

/* ---------- maths typesetting ---------- */
function typeset(el){
  if(window.MathJax && MathJax.typesetPromise){
    try{ MathJax.typesetClear && MathJax.typesetClear([el]); }catch(e){}
    MathJax.typesetPromise([el]).catch(() => {});
  }
}
window.__typesetAll = () => typeset(document.getElementById("app"));

/* ---------- grading ---------- */
function record(qid, v){
  const e = qIndex.get(qid); if(!e) return;
  progress[qid] = {v, ok: Core.isCorrect(e.q, v)};
  store.set(K_PROG, progress);
}
const statsFor = qs => Core.tally(qs, progress);

/* ---------- rendering pieces ---------- */
const LETTERS = ["A","B","C","D","E"];
// "CAT 2023 Slot 1, question 47" (a set: "CAT 2023 Slot 1, set 3")
function srcLine(u, q, n){
  const where = u.paper ? paperLabel(u.paper) : SECTION_NAME[u.section] || u.section;
  const num = q.n || n;
  return num ? `${where}, question ${num}` : where;
}
const typeLabel = q => q.type === "TITA" ? "TITA" : "MCQ";
function statusChip(q){
  const p = progress[q.id];
  if(!p) return "";
  return p.ok ? `<span class="chip ok">Correct</span>` : `<span class="chip bad">Incorrect</span>`;
}
function answerText(q){
  if(q.type === "TITA") return esc(q.answer);
  const i = Number(q.answer);
  if(q.optHtml) return `${LETTERS[i]}. <span class="mathy">${q.optHtml[i] ?? ""}</span>`;
  return q.hasImg ? `Option ${LETTERS[i]}` : `${LETTERS[i]}. ${inline(q.options?.[i] ?? "")}`;
}
/* shared by practice cards and the timed test screen (js/exam-view.js); no correctness marks */
function stemHtml(q, u){
  u = u || q;
  if(q.html){
    let h = `<div class="qtext mathy">${q.html}</div>`;
    if(q.hasImg && features.originals) h += `<details class="orig" ${q.figure ? "open" : ""}><summary>${q.figure ? "Figure from the paper" : "Compare with the original paper"}</summary>${imgTag("q", u, q.id, `Question ${q.n} as printed`)}</details>`;
    return h;
  }
  return q.hasImg ? imgTag("q", u, q.id, `Question ${q.n}`) : `<div class="qtext">${rich(q.text)}</div>`;
}
function optionLayout(q){
  const n = q.optHtml ? q.optHtml.length : (q.hasImg ? (q.nopts || (q.options||[]).length || 4) : (q.options||[]).length);
  return {n, compact: !!(q.hasImg && !q.hasOptImgs && !q.optHtml)};
}
function optionBodyHtml(q, u, i){
  u = u || q;
  if(q.optHtml) return `<span class="mathy">${q.optHtml[i] ?? ""}</span>`;
  if(q.hasOptImgs) return `<span class="optimg"><img alt="Option ${LETTERS[i]}" data-b="q" data-p="${esc(u.paper)}" data-s="${esc(u.section)}" data-id="${esc(q.id)}#o${i}"></span>`;
  return q.hasImg ? "" : `<span>${inline((q.options||[])[i] ?? "")}</span>`;
}
function directionsHtml(u){
  if(u.dirHtml) return `<div class="qtext mathy">${u.dirHtml}</div>`;
  return u.hasDirImg ? imgTag("q", u, u.id, "Set directions") : `<div class="qtext">${rich(u.directions)}</div>`;
}
const hasSetSolution = u => !!(u && u.kind === "set" && (features.originals ? u.hasSetSol : u.setExpl));
/* shared by practice and the review screen: answer line + explanation, no buttons */
function renderSolution(q, u){
  u = u || q;
  const none = hasSetSolution(u) ? "This question is worked out in the set explanation." : "The source paper has no worked explanation for this question.";
  const body = !features.originals ? explTag(u, q.id, q.expl)
    : q.hasSolImg ? imgTag("s", u, q.id, `Solution to question ${q.n}`)
    : (q.solution ? rich(q.solution) : `<p class="empty-note">${none}</p>`);
  return `<div class="solution"><h4>Solution</h4><div class="ans">Answer: ${answerText(q)}</div>${body}</div>`;
}
/* the set-level explanation body (practice set card and review), "" when the set has none */
function renderSetSolution(u){
  if(!hasSetSolution(u)) return "";
  return features.originals ? imgTag("s", u, u.id, "Set explanation") : explTag(u, u.id, true);
}
function qBody(q, u){
  u = u || q;
  const p = progress[q.id];
  const done = !!p, show = done || revealed.has(q.id);
  let h = stemHtml(q, u);
  if(q.type === "TITA"){
    const cls = done ? (p.ok ? "correct" : "wrong") : "";
    h += `<div class="tita"><input type="text" inputmode="decimal" id="in-${esc(q.id)}" class="${cls}" placeholder="Type your answer" value="${done ? esc(p.v) : ""}" ${done?"disabled":""} aria-label="Your answer">
      ${done ? `<span class="verdict ${p.ok?"ok":"bad"}">${p.ok?"Correct":"Incorrect"}</span>` : `<button class="btn primary small" data-act="tita" data-q="${esc(q.id)}">Check</button>`}</div>`;
  }else{
    const {n, compact} = optionLayout(q);
    h += `<ol class="${compact ? "optrow" : "opts"}">${Array.from({length:n}, (_, i) => {
      let cls = "", mark = "";
      if(show){ if(i === Number(q.answer)){ cls = "correct"; mark = "Correct answer"; } }
      if(done && Number(p.v) === i && !p.ok){ cls = "wrong"; mark = "Your answer"; }
      if(done && Number(p.v) === i && p.ok){ cls = "correct picked"; mark = "Your answer"; }
      const say = cls ? `, ${mark.toLowerCase()}` : "";
      if(compact) mark = "";
      return `<li><button class="opt ${cls}" data-act="pick" data-q="${esc(q.id)}" data-v="${i}" ${done?"disabled":""} aria-label="Option ${LETTERS[i]}${say}"><span class="k" aria-hidden="true">${LETTERS[i]}</span>${optionBodyHtml(q, u, i)}<span class="mark">${mark}</span></button></li>`;
    }).join("")}</ol>`;
  }
  h += `<div class="foot">`;
  if(!show) h += `<button class="btn small" data-act="reveal" data-q="${esc(q.id)}">Show solution</button>`;
  if(done) h += `<button class="btn small" data-act="retry" data-q="${esc(q.id)}">Try again</button>`;
  h += `</div>`;
  if(show) h += renderSolution(q, u);
  return h;
}
function qCard(u){
  return `<article class="card" id="c-${esc(u.id)}">
    <div class="meta"><span class="src">${esc(srcLine(u,u))}</span>${u.topic?`<span class="chip topic">${esc(u.topic)}</span>`:""}<span class="chip">${typeLabel(u)}</span>${statusChip(u)}</div>
    ${qBody(u, u)}</article>`;
}
function setCard(u){
  const st = statsFor(u.questions);
  return `<article class="card set" id="c-${esc(u.id)}">
    <div class="set-head"><div class="meta"><span class="src">${esc(srcLine(u,{},0))}${u.n?`, set ${esc(u.n)}`:""}</span>${u.topic?`<span class="chip topic">${esc(u.topic)}</span>`:""}<span class="chip">${st.correct} of ${st.questions} correct, ${st.attempted} tried</span></div>
      <h3>${esc(u.title || "Set")}</h3></div>
    <div class="set-body">
      <div class="directions"><div class="directions-inner"><h4>Directions</h4>
        ${directionsHtml(u)}
        ${hasSetSolution(u) ? (revealedSets.has(u.id) ? `<div class="setsol solution"><h4>Set explanation</h4>${renderSetSolution(u)}</div>` : `<button class="btn small" data-act="setsol" data-set="${esc(u.id)}">Show set explanation</button>`) : ""}
      </div></div>
      <div class="set-qs">${u.questions.map((q, j) => `<div class="set-q"><div class="qno"><b>Question ${j+1} of ${u.questions.length}</b><span class="src">Q${esc(q.n)} in the paper</span><span class="chip">${typeLabel(q)}</span>${statusChip(q)}</div>${qBody(q, u)}</div>`).join("")}</div>
    </div></article>`;
}
const unitCard = u => u.kind === "set" ? setCard(u) : qCard(u);

/* ---------- views ---------- */
const KINDS = [["full","Complete test","full test"],["VARC","VARC test","VARC test"],["DILR","DILR test","DILR test"],["QA","QA test","QA test"]];
// one "Last … test" link per kind that has a result, newest first; each reopens that review
function lastResults(id){
  const rows = [];
  KINDS.forEach(([k,,label]) => {
    if(!features.dilr && (k === "full" || k === "DILR")) return;
    const r = store.get(`catpyq.result.${id}.${k}`, null);
    if(r && r.score && typeof r.score.total === "number" && typeof r.score.max === "number")
      rows.push({at: typeof r.finishedAt === "number" ? r.finishedAt : 0, k, text: `Last ${label}: ${r.score.total} / ${r.score.max}`});
  });
  rows.sort((a, b) => b.at - a.at);
  return rows.length ? `<div class="last-results">${rows.map(x => `<a class="last-result" href="#review-${id}-${x.k}" title="Open the review">${esc(x.text)}</a>`).join("")}</div>` : "";
}
function paperBox(id, e){
  const [y, slot] = id.split("-");
  const head = `<h4 class="pslot"><span class="vh">CAT ${y} </span>Slot ${slot}</h4>`;
  if(!e) return `<div class="pbox off">${head}<div class="pmeta">Not loaded yet</div></div>`;
  const qs = items.filter(u => u.paper === id).flatMap(questionsOf), st = statsFor(qs);
  const kinds = KINDS.filter(([k]) => features.dilr || (k !== "full" && k !== "DILR"));
  const btn = ([k,t], cls) => `<button type="button" class="${cls}" data-act="start-test" data-paper="${id}" data-kind="${k}">${t}</button>`;
  const full = kinds.find(([k]) => k === "full"), secs = kinds.filter(([k]) => k !== "full");
  return `<div class="pbox">${head}
    <div class="tests">${full ? btn(full, "btn primary") : ""}<div class="seg quiet" role="group" aria-label="Section tests, CAT ${y} Slot ${slot}">${secs.map(x => btn(x, "")).join("")}</div></div>
    ${lastResults(id)}
    <a class="untimed" href="#paper-${id}">Practise untimed</a>${st.attempted ? `<span class="pmeta">${st.attempted} of ${qs.length} practised</span>` : ""}</div>`;
}
function paperGrid(avail){
  return `<div class="ptable"><div class="prow phead" aria-hidden="true"><div></div>${SLOTS.map(s => `<div>Slot ${s}</div>`).join("")}</div>
    ${YEARS.map(y => `<div class="prow"><h3 class="pyear">${y}</h3>${SLOTS.map(s => paperBox(`${y}-${s}`, avail.get(`${y}-${s}`))).join("")}</div>`).join("")}</div>`;
}
function viewHome(){
  const avail = papersAvailable();
  const total = items.flatMap(questionsOf).length;
  return `
  <section>
    <h1>Every CAT question since 2020</h1>
    <p class="lede">All 18 slots, ${total.toLocaleString("en-US")} questions. Practise a topic or sit a paper against the clock.</p>
  </section>
  <section>
    <div class="sec-head"><h2>Practise a topic</h2></div>
    <div class="shelves">${SECTIONS.map(sec => {
      const secQs = items.filter(u => u.section === sec);
      const opts = topicList(sec).map(t => [t, secQs.filter(u => u.topic === t).flatMap(questionsOf).length]).filter(o => o[1]);
      return `<div class="shelf home-pick">
        <label for="home-${sec}">${esc(SECTION_SHORT[sec])}<small>${secQs.flatMap(questionsOf).length} questions</small></label>
        <select id="home-${sec}" data-act="home-topic" data-sec="${sec}"><option value="">Choose a topic</option>${opts.map(([t,n]) => `<option value="${esc(t)}">${esc(t)} (${n})</option>`).join("")}</select></div>`;
    }).join("")}</div>
  </section>
  <section>
    <div class="sec-head"><h2>Full papers</h2><p>Sit a whole paper or one section against the clock, or practise a slot untimed.</p></div>
    ${paperGrid(avail)}
  </section>`;
}
let openPicker = null;   // "topics" | "papers" | null
const optCount = (sec, key, val) => items.filter(u => u.section === sec && u[key] === val).flatMap(questionsOf).length;
function picker(id, key, allLabel, opts, sel){
  // opts: [{value,label,n}]
  const names = opts.filter(o => sel.includes(o.value)).map(o => o.label);
  const label = !names.length ? allLabel : names.length === 1 ? names[0] : `${names.length} ${allLabel.replace(/^All /,"")}`;
  const open = openPicker === key;
  return `<div class="ms" data-ms="${key}"><button type="button" class="ms-btn" id="${id}" aria-haspopup="true" aria-expanded="${open}" data-act="msopen" data-key="${key}"><span>${esc(label)}</span></button>
  <div class="ms-panel" id="${id}-panel" role="group" aria-label="${esc(allLabel)}" ${open?"":"hidden"}>
    <div class="ms-tools"><button type="button" data-act="msall" data-key="${key}">Select all</button><button type="button" data-act="msclear" data-key="${key}">Clear</button></div>
    ${opts.map((o,i)=>`<label class="ms-opt"><input type="checkbox" id="${id}-${i}" data-f="${key}" value="${esc(o.value)}" ${sel.includes(o.value)?"checked":""}><span>${esc(o.label)}</span><em>${o.n}</em></label>`).join("")}
  </div></div>`;
}
function tallyHtml(){
  const t = Core.tally(Core.filterUnits(items, {...filters, status:"all"}, progress), progress);
  const cells = [["questions","Questions",t.questions],["attempted","Attempted",t.attempted],["correct","Correct",t.correct],["wrong","Wrong",t.wrong],["notAttempted","Not attempted",t.notAttempted],["accuracy","Accuracy",t.accuracy===null?"\u2014":Math.round(t.accuracy*100)+"%"]];
  return `<div class="tally" id="tally" aria-label="Session tally">${cells.map(([k,l,v])=>`<div data-k="${k}"><b>${v}</b><span>${l}</span></div>`).join("")}</div>`;
}
const filtered = () => Core.filterUnits(items, filters, progress);
function viewPractice(){
  const sec = filters.section;
  const topics = topicList(sec).filter(t => items.some(u => u.section === sec && u.topic === t));
  const papers = [...new Set(items.filter(u => u.section === sec).map(u => u.paper).filter(Boolean))].sort().reverse();
  const pt = filters.topics.filter(t => topics.includes(t)), pp = filters.papers.filter(x => papers.includes(x));
  if(pt.length !== filters.topics.length || pp.length !== filters.papers.length){ filters.topics = pt; filters.papers = pp; store.set(K_FILT, filters); }
  const list = filtered();
  const nq = list.flatMap(questionsOf).length;
  const unitWord = sec === "QA" ? "questions" : `sets, ${nq} questions`;
  return `
  <section><h1>${SECTION_NAME[sec]}</h1></section>
  <div><div class="toolbar">
    <div class="field"><span class="lbl">Section</span><div class="seg" role="group" aria-label="Section">${SECTIONS.map(s=>`<button data-act="sec" data-sec="${s}" aria-pressed="${s===sec}">${s}</button>`).join("")}</div></div>
    <div class="field"><label for="f-topics">Topic</label>${picker("f-topics","topics","All topics",topics.map(t=>({value:t,label:t,n:optCount(sec,"topic",t)})),filters.topics)}</div>
    <div class="field"><label for="f-papers">Paper</label>${picker("f-papers","papers","All papers",papers.map(p=>({value:p,label:paperLabel(p),n:optCount(sec,"paper",p)})),filters.papers)}</div>
    <div class="field"><label for="f-status">Show</label><select id="f-status" data-f="status">
      <option value="all" ${filters.status==="all"?"selected":""}>Everything</option>
      <option value="new" ${filters.status==="new"?"selected":""}>Not attempted</option>
      <option value="wrong" ${filters.status==="wrong"?"selected":""}>Got wrong</option></select></div>
    <span class="count">${sec==="QA" ? `${list.length} questions` : `${list.length} ${unitWord}`}</span>
  </div>
  ${tallyHtml()}
  <div class="list" style="margin-top:20px">${list.length ? list.map(unitCard).join("") : `<div class="empty"><h3>Nothing matches these filters</h3><p>Change the topic, paper or Show filter.</p></div>`}</div></div>`;
}
let paperSection = "QA";
function viewPaper(id){
  const units = items.filter(u => u.paper === id);
  if(!units.length) return `<div class="empty"><h3>${esc(paperLabel(id))} isn’t loaded yet</h3><p>Pick another slot from <a href="#papers">Full papers</a>.</p></div>`;
  const secs = SECTIONS.filter(s => units.some(u => u.section === s));
  if(!secs.includes(paperSection)) paperSection = secs[0];
  const list = units.filter(u => u.section === paperSection).sort((a,b)=>(a.n||0)-(b.n||0));
  const st = statsFor(units.flatMap(questionsOf)), sst = statsFor(list.flatMap(questionsOf));
  return `
  <section class="paper-head"><div><h1>${esc(paperLabel(id))}</h1>
    <p class="lede">Untimed practice. ${st.attempted} of ${st.questions} attempted, ${st.correct} correct.</p></div>
    <div class="confirm" id="reset-paper"><button class="btn small danger" data-act="ask-reset-paper">Reset this paper</button></div></section>
  <div class="toolbar"><div class="field"><span class="lbl">Section</span><div class="seg" role="group" aria-label="Section">${secs.map(s=>`<button data-act="psec" data-sec="${s}" aria-pressed="${s===paperSection}">${s}</button>`).join("")}</div></div>
    <span class="count">${sst.correct} of ${sst.questions} correct, ${sst.attempted} tried</span></div>
  <div class="list">${list.map(unitCard).join("")}</div>`;
}
function viewPapers(){
  return `<section><h1>Full papers</h1>
  <p class="lede">Sit a whole paper or one section against the clock, or practise a slot untimed. Your answers are kept in this browser.</p></section>
  ${paperGrid(papersAvailable())}`;
}
/* ---------- router ---------- */
const app = document.getElementById("app");
let testTick = null;
function route(){
  const h = (location.hash || "#home").slice(1);
  let html, navKey = h;
  if(testTick){ clearInterval(testTick); testTick = null; }
  const timed = /^(test|review)-/.test(h);
  app.classList.toggle("wide", h.startsWith("test-"));
  if(timed){
    document.querySelectorAll("#nav a").forEach(a => a.removeAttribute("aria-current"));
    TestView.render(h);
    if(h.startsWith("test-")) testTick = setInterval(TestView.onTick, 1000);
    return;
  }
  if(h === "practice") html = viewPractice();
  else if(h === "papers") html = viewPapers();
  else if(h.startsWith("paper-")){ html = viewPaper(h.slice(6)); navKey = "papers"; }
  else { html = viewHome(); navKey = "home"; }
  document.querySelectorAll("#nav a").forEach(a => { if(a.getAttribute("href") === "#"+navKey) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  app.innerHTML = html;
  observeImgs(app); typeset(app);
}
function rerenderKeepScroll(anchorId){
  const el = anchorId && document.getElementById(anchorId);
  const unit = el && items.find(u => "c-" + u.id === anchorId);
  if(!el || !unit){ route(); return; }
  const tl = document.getElementById("tally");
  if(tl){ const tmpT = document.createElement("div"); tmpT.innerHTML = tallyHtml(); tl.replaceWith(tmpT.firstElementChild); }
  const before = el.getBoundingClientRect().top;
  const tmp = document.createElement("div"); tmp.innerHTML = unitCard(unit);
  const fresh = tmp.firstElementChild;
  // keep already-loaded images so nothing flickers
  el.querySelectorAll("img[data-b][src]").forEach(old => {
    const twin = fresh.querySelector(`img[data-b="${old.dataset.b}"][data-id="${CSS.escape(old.dataset.id)}"]`);
    if(twin) twin.src = old.src;
  });
  el.replaceWith(fresh); observeImgs(fresh); typeset(fresh);
  window.scrollBy(0, fresh.getBoundingClientRect().top - before);
}
const cardIdOf = qid => { const e = qIndex.get(qid); return e ? "c-" + e.unit.id : null; };
window.App = {get items(){ return items; }, store, esc, typeset, imgTag, observeImgs, paperLabel, LETTERS,
  get features(){ return features; }, stemHtml, renderSolution, renderSetSolution, optionBodyHtml, optionLayout, directionsHtml, route};

app.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]");
  if(ev.target.closest(".tscreen, .t-modal, .t-review") || (b && b.dataset.act === "start-test")){ TestView.onClick(ev); return; }
  if(!b) return;
  const act = b.dataset.act, qid = b.dataset.q;
  if(act === "pick"){ record(qid, Number(b.dataset.v)); rerenderKeepScroll(cardIdOf(qid)); }
  else if(act === "tita"){
    const inp = document.getElementById("in-" + qid); const v = inp ? inp.value.trim() : "";
    if(!v){ inp && inp.focus(); return; }
    record(qid, v); rerenderKeepScroll(cardIdOf(qid));
  }
  else if(act === "reveal"){ revealed.add(qid); rerenderKeepScroll(cardIdOf(qid)); }
  else if(act === "setsol"){ revealedSets.add(b.dataset.set); rerenderKeepScroll("c-" + b.dataset.set); }
  else if(act === "retry"){ delete progress[qid]; revealed.delete(qid); store.set(K_PROG, progress); rerenderKeepScroll(cardIdOf(qid)); }
  else if(act === "topic"){ filters.section = b.dataset.sec; filters.topics = [b.dataset.topic]; filters.papers = []; store.set(K_FILT, filters); location.hash = "practice"; window.scrollTo(0,0); }
  else if(act === "sec"){ openPicker = null; filters.section = b.dataset.sec; filters.topics = []; filters.papers = []; store.set(K_FILT, filters); route(); }
  else if(act === "msopen"){ openPicker = openPicker === b.dataset.key ? null : b.dataset.key; route(); const t = document.getElementById("f-" + b.dataset.key); t && t.focus(); }
  else if(act === "msall" || act === "msclear"){
    const key = b.dataset.key;
    filters[key] = act === "msclear" ? [] : [...app.querySelectorAll(`input[data-f=${key}]`)].map(i => i.value);
    store.set(K_FILT, filters); route(); const t = document.getElementById("f-" + key); t && t.focus();
  }
  else if(act === "psec"){ paperSection = b.dataset.sec; route(); }
  else if(act.startsWith("ask-")){
    const box = b.parentElement, what = act.slice(4);
    box.innerHTML = `<span style="font-size:14px">Are you sure?</span><button class="btn small danger" data-act="do-${what}">Yes, clear</button><button class="btn small" data-act="cancel">Cancel</button>`;
  }
  else if(act === "cancel") route();
  else if(act === "do-reset-all"){ progress = {}; revealed.clear(); store.set(K_PROG, progress); route(); }
  else if(act === "do-reset-paper"){
    const id = location.hash.slice(7);
    items.filter(u => u.paper === id).flatMap(questionsOf).forEach(q => { delete progress[q.id]; revealed.delete(q.id); });
    store.set(K_PROG, progress); route();
  }
});
app.addEventListener("change", ev => {
  const hs = ev.target.dataset && ev.target.dataset.act === "home-topic" ? ev.target : null;
  if(hs){
    if(!hs.value) return;
    filters = {section: hs.dataset.sec, topics: [hs.value], papers: [], status: "all"};
    store.set(K_FILT, filters); location.hash = "practice"; window.scrollTo(0,0);
    return;
  }
  const f = ev.target.dataset.f; if(!f) return;
  if(f === "topics" || f === "papers"){
    filters[f] = [...app.querySelectorAll(`input[data-f=${f}]:checked`)].map(i => i.value);
    const id = ev.target.id;
    store.set(K_FILT, filters); route();
    const again = document.getElementById(id); again && again.focus();
    return;
  }
  filters[f] = ev.target.value;
  store.set(K_FILT, filters); route();
});
function closePicker(refocus){
  if(!openPicker) return;
  const key = openPicker; openPicker = null;
  document.querySelectorAll(".ms-panel").forEach(p => p.hidden = true);
  document.querySelectorAll(".ms-btn").forEach(b => b.setAttribute("aria-expanded","false"));
  if(refocus){ const t = document.getElementById("f-" + key); t && t.focus(); }
}
document.addEventListener("click", ev => { if(openPicker && ev.target.isConnected && !ev.target.closest(".ms")) closePicker(false); });
document.addEventListener("keydown", ev => { if(ev.key === "Escape") closePicker(true); });
app.addEventListener("keydown", ev => {
  if(ev.key === "Enter" && ev.target.matches(".tita input")){
    const btn = ev.target.parentElement.querySelector("[data-act=tita]"); btn && btn.click();
  }
});
app.addEventListener("toggle", ev => {
  if(ev.target.matches && ev.target.matches("details.orig") && ev.target.open) ev.target.querySelectorAll("img[data-b]:not([src])").forEach(hydrate);
}, true);
// tap an image to open it full size
let zoomEl = null;
function closeZoom(){ if(zoomEl){ zoomEl.remove(); zoomEl = null; } }
app.addEventListener("click", ev => {
  const img = ev.target.closest(".imgpaper img[src]"); if(!img) return;
  closeZoom();
  zoomEl = document.createElement("div"); zoomEl.className = "zoom";
  zoomEl.setAttribute("role","dialog"); zoomEl.setAttribute("aria-label","Enlarged image");
  zoomEl.innerHTML = `<div class="zoom-bar"><button class="btn" id="zoom-close">Close</button></div><div class="zoom-body"><img alt="${esc(img.alt)}"></div>`;
  zoomEl.querySelector("img").src = img.src;
  zoomEl.addEventListener("click", e => { if(e.target === zoomEl || e.target.id === "zoom-close") closeZoom(); });
  document.body.appendChild(zoomEl); zoomEl.querySelector("#zoom-close").focus();
});
document.addEventListener("keydown", e => { if(e.key === "Escape") closeZoom(); });
window.addEventListener("hashchange", () => { openPicker = null; closeZoom(); route(); window.scrollTo(0,0); });
fetch("data/meta.json").then(r => r.ok ? r.json() : {items:[]}).catch(() => ({items:[]}))
  .then(d => { base = d && d.items ? d : {items:[]}; rebuild(); route(); });
})();
</script>

</body>
